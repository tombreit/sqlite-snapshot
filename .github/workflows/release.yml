# Build the wheel and sdist for a version tag and attach them to a GitHub
# release. Projects with hashed requirements (pip-compile --generate-hashes)
# install the wheel by its release URL; release assets don't change.
#
# Release: bump `version` in pyproject.toml, commit, then
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ".[django,test]"
          .venv/bin/pytest

      - name: Build wheel and sdist
        run: |
          .venv/bin/pip install build
          .venv/bin/python -m build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
